[package]
name = "bacon"
version = "3.25.0"
authors = ["dystroy <denys.seguret@gmail.com>"]
repository = "https://github.com/Canop/bacon"
description = "background rust compiler"
edition = "2024"
keywords = ["rust", "background", "compiler", "watch", "inotify"]
license = "AGPL-3.0"
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.85"
exclude = [
    "/.github/",
    "/bacon.json",
    "/bacon.toml",
    "/build-scripts/",
    "/deny.toml",
    "/flake.lock",
    "/flake.nix",
    "/fmt.sh",
    "/img/",
    "/install.sh",
    "/rustfmt.toml",
    "/website/",
]

[features]
default = []
clipboard = ["arboard"]
sound = ["rodio"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.4", default-features = false, optional = true }
cargo_metadata = "0.19"
clap = { version = "4.6", features = ["derive", "cargo"] }
clap-help = "1.6"
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
cli-log = "2.1"
crokey = "1.5"
ctrlc = "3.4"
directories-next = "2.0.0"
gix = { version = "0.87", default-features = false, features = [ "sha1", "index", "excludes", "parallel" ] }
glob = "0.3"
iq = { version = "0.5", features = ["template"] }
lazy-regex = "3.6"
notify = "8.2.0"
paste = "1.0"
rodio = { version = "0.21", optional = true, default-features = false, features = [ "flac", "mp3", "vorbis", "wav", "playback", "tracing" ] }
rustc-hash = "2"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
termimad = "0.35.4"
toml = "1"
unicode-width = "0.2"
vte = "0.15"

[dev-dependencies]
pretty_assertions = "1.4"

[lints.clippy]
bool_to_int_with_if = "allow"
bool_assert_comparison = "allow"
derive_partial_eq_without_eq = "allow"
get_first = "allow"
len_without_is_empty = "allow"
map_entry = "allow"
new_without_default = "allow"
return_self_not_must_use = "allow"
unnecessary_debug_formatting = "allow"
while_let_on_iterator = "allow"

[profile.release]
debug = false
lto = "fat"
strip = "symbols"
codegen-units = 1

